<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinControl — Salidas</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/movimientos.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">💰</div>
        <span>FinControl</span>
      </div>
      <nav id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <button class="theme-toggle-btn" data-theme-toggle type="button">
          <span class="theme-icon">🌙</span>
          <span class="theme-label">Modo oscuro</span>
        </button>
      </div>
    </aside>

    <main class="content">
      <header class="page-header">
        <h1>⬇️ Registrar salida</h1>
        <div class="header-actions">
          <button class="btn-icon" data-theme-toggle type="button" title="Cambiar tema">
            <span class="theme-icon">🌙</span>
          </button>
        </div>
      </header>

      <div class="alert alert-error" id="expense-alert"></div>
      <div class="alert alert-success" id="expense-success"></div>

      <!-- Formulario de salida -->
      <section class="card">
        <form id="expense-form" novalidate>
          <div class="form-grid">
            <div class="field">
              <label for="exp-amount">Monto <span class="req">*</span></label>
              <input type="text" id="exp-amount" inputmode="decimal" placeholder="0.00">
              <span class="field-error" id="err-exp-amount">Ingresa un monto mayor que cero.</span>
            </div>

            <div class="field">
              <label for="exp-date">Fecha <span class="req">*</span></label>
              <input type="date" id="exp-date">
              <span class="field-error" id="err-exp-date">Selecciona una fecha.</span>
            </div>

            <div class="field full">
              <label for="exp-account">Cuenta de origen <span class="req">*</span></label>
              <select id="exp-account">
                <option value="">— Selecciona una cuenta —</option>
              </select>
              <span class="field-error" id="err-exp-account">Debes seleccionar una cuenta.</span>
            </div>

            <div class="field full">
              <label>Categoría del gasto <span class="req">*</span></label>
              <div class="chip-options" id="exp-category-options"></div>
              <span class="field-error" id="err-exp-category">Selecciona una categoría.</span>
            </div>

            <div class="field full">
              <label for="exp-desc">Descripción del gasto <span class="optional-hint">(opcional)</span></label>
              <input type="text" id="exp-desc" maxlength="120" placeholder="Ej: Almuerzo, taxi, recibo…">
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Guardar salida</button>
          </div>
        </form>
      </section>

      <!-- Salidas recientes -->
      <h2 class="section-title" style="margin-top: 24px;">⬇️ Salidas registradas</h2>
      <div id="expenses-list"></div>
      <div id="expenses-empty" class="empty-state" hidden>
        <div class="empty-icon">⬇️</div>
        <p>Aún no hay salidas registradas.</p>
      </div>
    </main>

    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h2 id="modal-title">Confirmar</h2>
      <p id="modal-text"></p>
      <div class="modal-actions">
        <button class="btn btn-outline" id="modal-cancel" type="button">Cancelar</button>
        <button class="btn btn-danger" id="modal-ok" type="button">Eliminar</button>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/salidas.js"></script>
</body>
</html>
